<!doctype HTML>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory game </title>
<link rel="stylesheet" href="memorystyle.css">
</head>
<body>
<dialog id="gameDialog">
  <h2 id="dialogTitle"></h2>
  <div id="stars">
  <img id="image1" src = "images/star.png"  height="70px" width="70px" ></img><img id="image2" src = "images/star.png"  height="100px" width="100px" ></img><img id="image3" src = "images/star.png"  height="90px" width="90px"></img> 
  </div>
  <p id="dialogMessage"></p>

  <div class="dialog-actions">
    <button id="dialogRestart" onclick="restartGame()">Restart</button>
    <button id="dialogNext" onClick="startNextLevel()">Next Level</button>
  </div>
</dialog>
 
<div id="header">
    
       <span id="timer"> </span>
       <span id="moves"> </span>

</div>
<div class="game-area">
      <div id="img-grid" class="grid-container"></div>
</div>
</div>


</body>
<script src="memory.js" ></script>
</html>
